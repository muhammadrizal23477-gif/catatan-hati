<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Catatan Hati</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="spine"></div>
  <div class="shell">
    <header class="header">
      <div class="eyebrow">catatan malam</div>
      <h1>Catatan Hati</h1>
      <p class="sub">tempat menulis rasa, dan tempat rasa itu dijawab</p>
    </header>

    <div class="body">
      <nav class="tabs" id="tabs">
        <button class="tab-btn active" data-tab="tulis">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 3c-6 0-14 4-16 14 3-1 6-2 8-4M20 3c0 6-4 14-14 16M20 3l-9 9" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Kata &amp; Puisi</span>
        </button>
        <button class="tab-btn" data-tab="curhat">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 20s-7-4.35-9.5-9C.8 7.2 3 3.5 7 3.5c2 0 3.7 1.2 5 3 1.3-1.8 3-3 5-3 4 0 6.2 3.7 4.5 7.5C19 15.65 12 20 12 20z" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Ruang Curhat</span>
        </button>
        <button class="tab-btn" data-tab="tiktok">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v13m0 0l-5-5m5 5l5-5M4 20h16" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Unduh TikTok</span>
        </button>
      </nav>

      <main class="main">
        <!-- TAB 1: Kata & Puisi -->
        <section class="panel" id="panel-tulis">
          <div class="field-row">
            <label class="label">Tema</label>
            <div class="chip-row" id="kategori-chips">
              <button class="chip active" data-val="Motivasi">Motivasi</button>
              <button class="chip" data-val="Cinta">Cinta</button>
              <button class="chip" data-val="Sedih">Sedih</button>
              <button class="chip" data-val="Rindu">Rindu</button>
              <button class="chip" data-val="Perjuangan">Perjuangan</button>
              <button class="chip" data-val="Masalah Hidup">Masalah Hidup</button>
              <button class="chip" data-val="Syukur">Syukur</button>
            </div>
          </div>

          <div class="field-row">
            <label class="label">Bentuk</label>
            <div class="chip-row" id="jenis-chips">
              <button class="chip active" data-val="kata">Kata-kata singkat</button>
              <button class="chip" data-val="puisi">Puisi</button>
            </div>
          </div>

          <div class="field-row">
            <label class="label">Detail (opsional)</label>
            <input id="topik-input" class="input" placeholder="mis. tentang menyerah, tentang hujan, tentang ibu..." />
          </div>

          <button id="btn-generate" class="primary-btn">Tulis untukku</button>
          <p class="error" id="tulis-error"></p>
          <div class="paper-card hidden" id="paper-card">
            <p class="paper-text" id="paper-text"></p>
            <div class="paper-footer" id="paper-footer"></div>
          </div>
        </section>

        <!-- TAB 2: Ruang Curhat -->
        <section class="panel chat-wrap hidden" id="panel-curhat">
          <div class="chat-scroll" id="chat-scroll">
            <div class="bubble bubble-app">Ceritakan apa yang sedang kamu rasakan atau masalah yang sedang kamu hadapi. Aku akan coba dengarkan dan balas dengan kata-kata yang cocok untukmu.</div>
          </div>
          <div class="chat-input-row">
            <textarea id="chat-input" class="chat-input" rows="1" placeholder="Tulis apa yang kamu rasakan..."></textarea>
            <button id="btn-send" class="send-btn" aria-label="Kirim">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12l16-8-6 16-3-6-7-2z" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </section>

        <!-- TAB 3: TikTok -->
        <section class="panel hidden" id="panel-tiktok">
          <div class="tiktok-card">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#E8A845" stroke-width="1.6"><path d="M12 3v13m0 0l-5-5m5 5l5-5M4 20h16" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <h3>Unduh video TikTok</h3>
            <input id="tiktok-url" class="input" placeholder="Tempel link video TikTok di sini" />
            <button id="btn-tiktok" class="primary-btn">Cari video</button>
            <p class="error" id="tiktok-error"></p>

            <div class="tiktok-result hidden" id="tiktok-result">
              <img id="tiktok-cover" alt="Cover video" />
              <div class="tiktok-info">
                <div class="tiktok-title" id="tiktok-title"></div>
                <div class="tiktok-author" id="tiktok-author"></div>
                <a id="tiktok-download" class="primary-btn download-link" download>Unduh tanpa watermark</a>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
